<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Contact Aari Sankar through an accessible portfolio contact form.">
  <meta name="author" content="Aari Sankar">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://example.com/contact.html">
  <link rel="stylesheet" href="assets/style.css">
  <title>Contact | Aari Sankar</title>
</head>
<body>
<a class="skip-link" href="#main-content">Skip to main content</a>
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="index.html">Aari Sankar</a>
    <nav aria-label="Primary navigation">
      <ul class="nav-list">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a aria-current="page" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="main-content">
  <section class="page-heading" aria-labelledby="page-title">
    <div class="container">
      <p class="eyebrow">CONTACT</p>
      <h1 id="page-title">Let’s connect</h1>
      <p class="lead">Send a message using the accessible form below.</p>
    </div>
  </section>

  <section class="section" aria-labelledby="form-title">
    <div class="container form-wrap">
      <form id="contact-form" class="contact-form" action="#" method="post" novalidate>
        <h2 id="form-title">Contact form</h2>

        <div class="form-group">
          <label for="name">Full name <span aria-hidden="true">*</span></label>
          <input id="name" name="name" type="text" autocomplete="name" required aria-required="true" aria-describedby="name-help">
          <p id="name-help" class="help">Enter your full name.</p>
        </div>

        <div class="form-group">
          <label for="email">Email address <span aria-hidden="true">*</span></label>
          <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required aria-required="true" aria-describedby="email-help">
          <p id="email-help" class="help">Example: name@example.com</p>
        </div>

        <div class="form-group">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" type="text" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="message">Message <span aria-hidden="true">*</span></label>
          <textarea id="message" name="message" rows="7" required aria-required="true" aria-describedby="message-help"></textarea>
          <p id="message-help" class="help">Tell me how I can help.</p>
        </div>

        <div id="form-status" class="form-status" role="status" aria-live="polite" tabindex="-1"></div>

        <button class="button" type="submit">Send message</button>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; <span id="year">2026</span> Aari Sankar.</p>
    <a href="index.html">Home</a>
  </div>
</footer>
<script src="assets/script.js" defer></script>
</body>
</html>
